<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>4form_selectBasic</title>
</head>

<body>
    <h2>여러 항목 선택</h2>

        <option>돈까스</option>
        <option>어묵</option>
        <option>순대</option>
        <option>비빔면</option>
    </select>
    <h2>선택 옵션 묶기</h2>

        <optgroup label="HMTL_5">
            <option>Multimedia Tag</option>
            <option>Connetivity</option>
            <option>Device Access</option>
        </optgroup>
    </select>
    <select>
        <optgroup label="CSS3">
            <option>Animation</option>
            <option>3D Transform</option>
        </optgroup>
    </select>
</body>

</html>
