<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>CSS3 selector Basic</title>
    <style>
        /* * {color: blue;}
        h1, p {color:red;}
        p {color:yellow;} */    
        #header {
            width: 800px;
            margin: 0 auto;
            background: brown;
        }

        #wrap {
            width: 800px;
            margin: 0 auto;
            overflow: hidden;
        }

        #aside {
            width: 200px;
            float: left;
            background: blue;
        }

        #content {
            width: 600px;
            float: left;
            background: green;
        }

        #rint {
            color: aqua;
        }

        .select {
            color: darkgoldenrod;
        }

        .item {
            color: violet;
        }

        .header {
            background: darkblue;
        }

        li.select {
            color: blueviolet;
        }
    </style>
</head>

<body>
    <h2>1.전체 선택자</h2>
    <h2>2.태그 선택자</h2>
    <h2>3.아이디 선택자</h2>
    <h2 class="item header">4.클래스 선택자</h2>
    <hr>
    <ul>
        <li class="select">사과</li>
        <li>딸기</li>
        <li class="select">수박</li>
        <li class="select">복숭아</li>
    </ul>
    <hr>
    <h1>제목 글자</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <p>Accusantium maxime rerum, est dolores quod autem, nam officia incidunt voluptas, reiciendis animi. Fugit,
        provident!</p>

    <hr>
    <div id="header">   
        <h1>#header태그</h1>
    </div>
    <div id="warp">
        <div id="aside">
            <h1>#aside태그</h1>
        </div>
        <div id="content">
            <h1>#content태그</h1>
        </div>
    </div>
    </div>
</body>

</html>
