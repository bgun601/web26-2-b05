<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>7.그림자와 그레이디언트 속성</title>
    <style>
        h1 {
            border: 5px solid black;
            text-shadow: 10px 10px 10px darkgoldenrod, 10px 10px 20px blue, 10px 10px 30px darkgrey;
            box-shadow: 10px 10px 10px darkgoldenrod, 10px 10px 20px blue, 10px 10px 30px darkgrey;
            /* text-shadow: 5px 5px 5px darkblue;
            box-shadow: 10px 10px 10px darkcyan; */
        }
    </style>

</head>

<body>
    <h2>7.7. 그림자와 그레이디언트 속성</h2>
    <h3>1. text-shadow 속성</h3>
    <h3>2. box-shadow 속성</h3>
    <hr>
    <h1>lorem ipsum dolor sit amet consectetur</h1>
    <hr>
    <p>이 문장은 그림자가 있습니다.</p>
    <div class="box">
        <h1>이 요소는 그림자가 있습니다.</h1>
    </div>

    <hr>
    <div class="gradient">
        <h1>CSS3 그레이디언트</h1>
    </div>
</body>

</html>
